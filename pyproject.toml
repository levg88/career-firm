[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "career-firm"
version = "0.2.0"
description = "Boutique agent-run career firm: import CVs, analyse jobs, and generate ATS-ready tailored CVs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Career Firm" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "python-docx>=1.1",
  "pypdf>=4.0",
  "fpdf2>=2.7",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
career-firm = "career_firm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
